name: Cost Estimation
on: [pull_request]

permissions:
  pull-requests: write
  id-token: write        # required to mint the branded c3x-cloud[bot] token

jobs:
  c3x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: c3xdev/c3x@main
        with:
          path: .
          branded-comments: true
