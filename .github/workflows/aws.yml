name: "cost: aws"

on:
  pull_request:
    paths:
      - "aws/**"
      - ".github/workflows/aws.yml"

permissions:
  contents: read
  pull-requests: write # post the cost comment
  id-token: write      # comment as c3x-cloud[bot] (C3X Cloud app installed)

jobs:
  estimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: c3xdev/c3x@v0
        env:
          C3X_COMMENT_TAG: aws # one comment per scenario on the same PR
        with:
          path: aws

      # Gate: fail the check when this PR adds more than $500/mo.
      # Runs as its own step, after the comment above is posted, so
      # reviewers always see the numbers even when the gate fails.
      - uses: c3xdev/c3x@v0
        with:
          path: aws
          comment: false
          budget-delta: "500"
