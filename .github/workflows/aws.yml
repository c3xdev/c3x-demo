name: "cost: aws"

on:
  pull_request:
    paths:
      - "aws/**"
      - ".github/workflows/aws.yml"

permissions:
  contents: read
  pull-requests: write # post the cost comment
  id-token: write      # comment as c3x-cloud[bot] (C3X Cloud app installed)

jobs:
  estimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: c3xdev/c3x@fix/action-gates-after-comment
        env:
          C3X_COMMENT_TAG: aws-gates-test
        with:
          path: aws
          budget-delta: "500"
          currency: EUR
