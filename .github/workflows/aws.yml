name: "cost: aws"

on:
  pull_request:
    paths:
      - "aws/**"
      - ".github/workflows/aws.yml"

permissions:
  contents: read
  pull-requests: write # post the cost comment
  id-token: write      # comment as c3x-cloud[bot] (C3X Cloud app installed)

jobs:
  estimate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The comment is always posted first; then the check fails if this
      # PR adds more than $500/mo.
      - uses: c3xdev/c3x@v0
        env:
          C3X_COMMENT_TAG: aws # one comment per scenario on the same PR
        with:
          path: aws
          budget-delta: "500"
